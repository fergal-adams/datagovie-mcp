services:
  - type: web
    name: datagovie-mcp
    runtime: docker
    plan: free          # the free plan sleeps when idle; see DEPLOY.md
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: RATE_LIMIT_GLOBAL_PER_MIN
        value: "300"
      - key: DATAGOVIE_MAX_MB
        value: "25"
